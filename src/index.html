<!doctype html>
<html lang="en" translate="no">
<head>
  <meta charset="utf-8">
  <!-- La traduction du navigateur se battrait avec le rendu d'Angular. -->
  <meta name="google" content="notranslate">
  <meta name="robots" content="noindex, nofollow">
  <title>Vigipelago</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <!-- Les sockets visent le serveur Archipelago choisi : ws et wss restent ouverts vers tout hote. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'">
  <!-- Pose le theme avant le premier rendu, sinon flash du theme par defaut. -->
  <script src="theme-init.js"></script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
